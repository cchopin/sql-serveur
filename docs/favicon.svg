  <rect x="13" y="13" width="38" height="11" rx="3" fill="#7DB3E3"/>
  <rect x="13" y="27" width="38" height="11" rx="3" fill="#4D7CA6"/>
  <rect x="13" y="41" width="38" height="11" rx="3" fill="#2F4B63"/>
</svg>
